# 未来新聞 — 毎朝の自動ビルド
# GAS でいう「時間主導型トリガー」の設定ファイル版

name: 毎朝の未来新聞ビルド

on:
  schedule:
    # cron は UTC 表記。5:30 JST = 前日 20:30 UTC
    - cron: '30 20 * * *'
  # 手動実行ボタンを Actions 画面に出す（動作確認用）
  workflow_dispatch:

# 生成物をリポジトリに書き戻すための権限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ページを生成
        run: node scripts/build.mjs
        env:
          # 値は GitHub の Secrets から渡される。ログにも出力されない
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 生成物をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --staged --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M') JST"
            git push
          fi
